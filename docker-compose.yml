name: minsu-doctrack

services:
  # -------------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: minsu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-5mdb02f6}
      POSTGRES_DB: ${POSTGRES_DB:-db_TDP}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_TDP}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - minsu_network

  # -------------------------------------------------------------------
  # Database Migration & Seeding Init Service (Runs once on startup)
  # -------------------------------------------------------------------
  db-init:
    container_name: minsu_db_init
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-5mdb02f6}@db:5432/${POSTGRES_DB:-db_TDP}?schema=public}
      FORCE_SEED: ${FORCE_SEED:-false}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - minsu_network

  # -------------------------------------------------------------------
  # Next.js Application Production Runner
  # -------------------------------------------------------------------
  app:
    container_name: minsu_app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9000}:9000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-5mdb02f6}@db:5432/${POSTGRES_DB:-db_TDP}?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:-minsu_doctrack_secure_session_secret_2026}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MinSU DocTrack}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      NODE_ENV: production
      PORT: 9000
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - minsu_network

volumes:
  db_data:
    name: minsu_db_data
  storage_data:
    name: minsu_storage_data

networks:
  minsu_network:
    name: minsu_network
    driver: bridge
