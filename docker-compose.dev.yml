# =====================================================================
# Docker Compose Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# =====================================================================

services:
  db-init:
    environment:
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-true}

  app:
    container_name: minsu_app_dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npx prisma generate && npm run dev"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-5mdb02f6}@db:5432/${POSTGRES_DB:-db_TDP}?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:-minsu_doctrack_secure_session_secret_2026}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MinSU DocTrack}
      COOKIE_SECURE: "false"
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
